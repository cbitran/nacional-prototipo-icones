<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nacional · Troca de ícones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d131c; --panel:#141d29; --panel-2:#1b2736; --line:#26364a;
    --text:#fff; --muted:#a0bbd9; --primary:#00c5f3; --primary-400:#2cd8ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Outfit,system-ui,sans-serif}
  button,select{font:inherit}

  /* ---------- barra de controles ---------- */
  .top{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:16px;align-items:end;
       padding:14px max(20px, calc((100% - 1440px) / 2 + 20px));background:#0a0f16;border-bottom:1px solid var(--line)}
  .top h1{font-size:16px;margin:0 16px 6px 0;font-weight:600}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px}
  [hidden]{display:none!important}
  .chip img{width:26px;height:26px;object-fit:contain}
  .chip.used{opacity:.28;border-style:dashed;cursor:default;pointer-events:none;filter:grayscale(1)}
  .tabs{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tabs button{background:none;border:0;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--primary);color:#032a36;font-weight:600}
  .reset{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
  .reset:hover{color:#fff;border-color:var(--muted)}
  .reset.armed{color:#fff;background:#b3261e;border-color:#b3261e}

  /* ---------- layout ---------- */
  .main{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px 20px;align-items:start}
  @media (max-width:900px){.main{grid-template-columns:1fr}}
  .stage{display:flex;justify-content:center;align-items:flex-start;min-height:70vh;padding:24px;
         background:repeating-linear-gradient(45deg,#0f1620 0 12px,#0d131c 12px 24px);border:1px solid var(--line);border-radius:16px}
  .hint{color:var(--muted);font-size:12px;margin:0 0 12px}

  /* ---------- paleta ---------- */
  .palette{position:sticky;top:90px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-height:calc(100vh - 110px);overflow:auto}
  .palette h2{font-size:13px;margin:0 0 2px;font-weight:600}
  .palette .src{font-size:11px;color:var(--muted);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;
        background:var(--panel-2);border:1px solid transparent;cursor:grab;user-select:none;color:var(--primary-400)}
  .chip:hover{border-color:var(--primary)}
  .chip:active{cursor:grabbing}
  .chip svg{font-size:26px}
  .chip span{font-size:9.5px;color:var(--muted);text-align:center;word-break:break-all;line-height:1.2}

  /* ---------- alvos de drop ---------- */
  .slot{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;transition:box-shadow .12s, transform .12s}
  body.dragging .slot{box-shadow:0 0 0 1px rgba(44,216,255,.45)}
  .slot.over{box-shadow:0 0 0 2px #fff, 0 0 12px 2px var(--primary)!important;transform:scale(1.15)}
  .slot.swapped::after{content:"";position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:#ffd30f}
  .slot img{width:100%;height:100%;object-fit:contain}

  /* nomes compostos (2 linhas) centralizados nos dois navs */
  .nav-b1 [data-item] > span, .nav-b1 [data-item] > small, .nav-t1 [data-item] > span{text-align:center}
  /* regra: nome composto nunca numa linha só — uma palavra por linha (exceto o depósito, que segue o texto do site) */
  [class^="nav-"] [data-item]:not([data-fixed]) > span:not(.slot), [class^="nav-"] [data-item]:not(.center) > span:not(.slot){width:min-content}

  /* ---------- reordenar itens do nav ---------- */
  .nav-b1 [data-item], .nav-t1 [data-item]{user-select:none;-webkit-user-select:none}
  [data-move]{cursor:grab}
  [data-move]:active{cursor:grabbing}
  body.reordering [data-item]:not([data-fixed]){outline:1px dashed rgba(255,255,255,.45);outline-offset:2px;border-radius:10px}
  [data-item].reorder-over{outline:2px solid #fff!important;outline-offset:2px;border-radius:10px;background:rgba(255,255,255,.12)}

  /* ---------- NAVBAR (moldura mobile) ---------- */
  .phone{width:390px;height:260px;border-radius:28px;background:#0d131c;outline:1px solid var(--line);position:relative;overflow:hidden;
         box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .phone .fake{position:absolute;inset:16px 16px 90px;border-radius:14px;background:linear-gradient(180deg,#17222f,#101824);display:grid;place-items:center;color:#2b3d52;font-size:12px}

  /* B1 */
  /* medidas do site (template-1, 390px): grupo de 3 itens + recorte 100px + grupo de 3 itens; barra 55px */
  .nav-b1{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:stretch;color:#000}
  .nav-b1 .grp{flex:1 1 0;min-width:0;min-height:55px;background:rgb(var(--p500));display:flex;align-items:flex-start;justify-content:space-around;padding:8px 0}
  .nav-b1 .grp.l{margin-right:-1px}
  .nav-b1 .grp.r{margin-left:-2px}
  /* como no site: largura pelo conteúdo + justify-around; ícone sempre na mesma linha (8px do topo); texto 10px/15px 500 embaixo */
  .nav-b1 .it{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;line-height:15px;font-weight:500}
  .nav-b1 .it .slot{font-size:20px;width:20px;height:20px}
  /* Slots no site: ícone w-7 (28px) e texto -mt-1 mb-1 */
  .nav-b1 .it.big .slot{font-size:28px;width:28px;height:28px;margin-top:-4px}
  .nav-b1 .it.big > span:not(.slot){margin:-4px 0 4px}
  .nav-b1 .notch{position:relative;flex:0 0 100px}
  .nav-b1 .notch .shape{position:absolute;inset:0;width:100%;height:100%;color:rgb(var(--p500))}
  .nav-b1 .notch .txt{position:absolute;bottom:.1rem;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;color:rgb(var(--p950))}
  .nav-b1 .notch .txt span{font-size:10px;font-weight:700;line-height:1.25}
  .nav-b1 .notch .txt small{font-size:8px;font-weight:500;line-height:1.25;white-space:nowrap}
  .nav-b1 .notch .bubble{position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:2;width:48px;height:48px;border-radius:50%;
                         background:rgb(var(--p500));display:flex;align-items:center;justify-content:center;color:#fff}
  .nav-b1 .notch .bubble .slot{font-size:28px;width:28px;height:28px}
  /* site: texto do depósito text-primary-950 · itens comuns hover:opacity-80 transition-opacity */
  .nav-b1 .it{transition:opacity .15s cubic-bezier(.4,0,.2,1)}
  .nav-b1 .it:hover{opacity:.8}

  /* T1 */
  /* T1 — medidas, cores e hover copiados do CSS do site (template-2, #t2-mobile-menu-bar) */
  /* cores: variáveis --p200..--p950 e --m300 vêm do tema ou da Brand escolhida (aplicadas em #stage) */
  .nav-t1{
          position:absolute;left:0;right:0;bottom:0;height:72px;border-radius:24px 24px 0 0;
          background:linear-gradient(rgba(36,38,50,.81),rgba(19,20,25,.9));
          display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px 16px}
  .nav-t1 .it{flex:1;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
              font-size:12px;line-height:1.25;color:rgba(255,255,255,.5);background:none;border:0;cursor:pointer;transition:transform .2s,opacity .2s}
  .nav-t1 .it:active{transform:scale(.94)}
  .nav-t1 .ic{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s}
  .nav-t1 .it:hover .ic{transform:translateY(-2px)}
  .nav-t1 .pill{position:absolute;inset:-6px -12px;border-radius:9999px;background:rgb(var(--p500)/.15);opacity:0;transform:scale(.6);transition:transform .2s,opacity .2s}
  .nav-t1 .it:hover .pill,.nav-t1 .it.active .pill{opacity:1;transform:scale(1)}
  .nav-t1 .it.active{color:rgb(var(--p500))}
  .nav-t1 .ic .slot{position:relative;font-size:24px;width:24px;height:24px}
  .nav-t1 .center{flex:1;height:84px;margin-bottom:-12px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;
                  background:none;border:0;cursor:pointer;color:rgba(255,255,255,.9);font-size:12px;line-height:1.25;text-align:center}
  .nav-t1 .deposit{flex:0 0 auto;width:52px;height:52px;margin-bottom:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                   background:linear-gradient(to top,rgb(var(--p500)),rgb(var(--p200)));box-shadow:0 8px 24px rgb(var(--p500)/.4);color:rgb(var(--p950));transition:transform .2s,opacity .2s}
  .nav-t1 .center:hover .deposit{transform:scale(1.06)}
  .nav-t1 .center:active .deposit{transform:scale(.96)}
  .nav-t1 .center > span{margin:-6px 0 10px}
  .nav-t1 .deposit .slot{font-size:28px;width:28px;height:28px}
  @media (prefers-reduced-motion:reduce){.nav-t1 .it,.nav-t1 .ic,.nav-t1 .pill,.nav-t1 .deposit{transition:none}}

  .slot .emoji{font-size:inherit;line-height:1}

  /* ---------- NB · nav mobile LOGADO (#mobile-menu-bar: fixed bottom-0 w-full, 64px; lido no Chrome logado em 14/09/2026)
     visitante: o mesmo elemento vira coluna vertical à direita — não usado no protótipo ---------- */
  .nav-nb{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgb(var(--m900) / .9);backdrop-filter:blur(16px);box-shadow:0 0 15px rgba(0,0,0,.2);
          display:flex;flex-direction:row;align-items:center;justify-content:center;color:#fff;font-family:Montserrat,system-ui,sans-serif}
  .nav-nb::before{content:"";position:absolute;top:0;left:0;width:100%;height:1px;background:rgba(255,255,255,.12)}
  /* itens flex 1 (≈55px em 390): ícone 20px, 3px, texto 10px/15px 600 */
  .nav-nb .it{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;line-height:15px;font-weight:600;text-align:center}
  .nav-nb .center{align-self:stretch;justify-content:flex-start}
  .nav-nb .it .slot{font-size:20px;width:20px;height:20px}
  .nav-nb .it.active{color:rgb(var(--p300))}
  .nav-nb .dep{width:36px;height:36px;margin:12px 0 16px;border-radius:50%;background:linear-gradient(to top,rgb(var(--p600)),rgb(var(--p500)));
               box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;color:#fff}
  .nav-nb .dep .slot{font-size:32px;width:32px;height:32px}

  /* ---------- T2 · nav (bg-muted-900, border-t-2 muted-800, rounded-t-3xl; ilustrações 40px; texto 10px 600) ---------- */
  .nav-t2{position:absolute;left:0;right:0;bottom:0;font-family:"Bricolage Grotesque",system-ui,sans-serif}
  .nav-t2 .bar{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:12px 16px 24px;border-top:2px solid rgb(var(--m800));border-radius:24px 24px 0 0;background:rgb(var(--m900))}
  .nav-t2 .it{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:10px;line-height:10px;font-weight:600;text-align:center}
  .nav-t2 .ic{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:9999px}
  .nav-t2 .ic .slot{position:relative;z-index:1;width:40px;height:40px;font-size:32px}
  .nav-t2 .glow{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;background:#05748D;filter:blur(20px)}
  .nav-t2 .hid{visibility:hidden}
  .nav-t2 .center{position:relative;justify-content:flex-end;gap:8px}
  .nav-t2 .dep{position:absolute;top:-28px;width:62px;height:62px;border-radius:40px;border:2px solid rgb(var(--p600));background:linear-gradient(to bottom,rgb(var(--p500)),rgb(var(--p800)));
               box-shadow:0 4px 20px 0 rgba(0,100,137,.3);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
  .nav-t2 .dep:active{transform:scale(.95)}
  .nav-t2 .dep .slot{width:48px;height:48px;font-size:32px}

  /* ---------- B2 · nav (barra SVG fill-primary-800, grid 5 colunas; ícones 24px e texto 11px primary-200) ---------- */
  .nav-b2{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;font-family:Outfit,system-ui,sans-serif}
  .nav-b2 .wrap{position:relative;width:100%;max-width:380px}
  .nav-b2 .shape{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;filter:drop-shadow(0 -4px 18px rgba(0,0,0,.35))}
  .nav-b2 .shape path{fill:rgb(var(--p800))}
  .nav-b2 .grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;min-height:90px;max-width:300px;margin:0 auto}
  .nav-b2 .it{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:16px;
              color:rgb(var(--p200));font-size:11px;line-height:1;font-weight:500;text-align:center;transition:transform .15s}
  .nav-b2 .it:active{transform:scale(.95)}
  .nav-b2 .it .slot{font-size:24px;width:24px;height:24px}
  .nav-b2 .glow{position:absolute;left:50%;top:-20px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;filter:blur(8px);opacity:.6;mix-blend-mode:lighten;pointer-events:none;
                background:linear-gradient(180deg,rgb(var(--p500)),rgb(var(--s500)))}
  .nav-b2 .dep{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:rgb(var(--p900));display:flex;align-items:center;justify-content:center;color:#fff}
  .nav-b2 .dep .slot{font-size:28px;width:28px;height:28px}

  /* ---------- MENU LATERAL ---------- */
  .aside{width:248px;display:flex;flex-direction:column;gap:10px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;color:#fff;font-size:13px}
  .row:hover{background:rgba(255,255,255,.04)}
  .row .slot{font-size:16px;width:18px;height:18px;flex:0 0 auto}
  .chev{margin-left:auto;opacity:.5;font-size:14px;display:inline-flex}

  /* B1 */
  .b1 .row .slot{color:rgb(var(--p400) / .5)}
  /* cards do topo no site: from-primary-500 to-primary-600, border-primary-900, text-primary-950 */
  .b1 .card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;font-size:13px;font-weight:600;
            background:linear-gradient(rgb(var(--p500)),rgb(var(--p600)));border:1px solid rgb(var(--p900));color:rgb(var(--p950))}
  .b1 .card .slot{width:36px;height:36px;font-size:32px;color:rgb(var(--p950))}
  .b1 .group-title{font-weight:600}
  .b1 .sub{padding-left:14px}
  .b1 .social{display:flex;justify-content:space-between;padding:8px 6px}
  .b1 .social .slot{width:34px;height:34px;border-radius:50%;background:rgb(var(--p500));color:rgb(var(--p950));font-size:18px}
  /* blocos no site: bg-muted-900 border-primary-500/10 · seta text-primary-400/40 · hover-shine: fundo branco 5% */
  .b1 .box{background:rgb(var(--m900));border-color:rgb(var(--p500) / .1)}
  .b1 .chev{opacity:1;color:rgb(var(--p400) / .4)}
  .b1 .row:hover{background:rgba(255,255,255,.05)}

  /* T1 */
  .t1 .tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .t1 .tile{position:relative;height:56px;border-radius:10px;background:linear-gradient(135deg,#1f3a52,#132232);display:flex;align-items:center;padding:0 8px;font-weight:600;font-size:12px;overflow:hidden}
  .t1 .tile .slot{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:36px;color:rgb(var(--p400))}
  .t1 .tile.over-scale .slot{transform:translateY(-50%) scale(1.15)}
  .t1 .tile.wide{grid-column:1 / -1}
  .t1 .head{display:flex;align-items:center;gap:10px;padding:12px 10px;font-weight:600;font-size:13px;letter-spacing:.02em}
  /* cores lidas do menu T1 no site: cabeçalho primary-500, seta em pastilha primary-800/50, itens muted-300 */
  .t1 .head .slot{width:18px;height:18px;color:rgb(var(--p500));font-size:18px}
  .t1 .head .chev{opacity:1;color:rgb(var(--p500));background:rgb(var(--p800) / .5);border-radius:6px;padding:3px}
  .t1 .row .slot{color:rgb(var(--m300))}
  .t1 .row{color:#fff}
  /* T1: blocos e tiles copiados de .sidebar-item do site (fundo muted-900 + borda em gradiente primary-500) */
  .t1 .box, .t1 .tile{background:linear-gradient(rgb(var(--m900)),rgb(var(--m900))) padding-box,
                      linear-gradient(0deg,rgb(var(--p500) / .3) 0,rgb(var(--p500) / 0)) border-box;
                      border:1px solid transparent;border-radius:8px;transition:.3s}
  .t1 .box{padding:0}
  /* .sidebar-mystery-box::before */
  .t1 .tile.wide::before{content:"";position:absolute;right:0;top:0;width:80px;height:80px;border-radius:8px;pointer-events:none;z-index:1;
                         background:radial-gradient(circle at top right,rgb(var(--p500) / .18) 0,rgb(var(--p500) / .09) 30%,rgb(var(--p500) / 0) 70%)}
  /* .menu-item: px-4 py-3 gap-3 border-l-2 transparente → hover:border-primary-500; ícone e texto deslizam 3px */
  .t1 .row{padding:12px 16px;gap:12px;border-radius:0;border-left:2px solid transparent}
  .t1 .row:hover{background:none;border-left-color:rgb(var(--p500))}
  .t1 .row > .slot, .t1 .row > span{transition:transform .2s}
  .t1 .row:hover > .slot, .t1 .row:hover > span{transform:translateX(3px)}

  /* ---------- NB · menu (Montserrat; botões 3D; linhas com hover bg-white/10 e translate-x-1) ---------- */
  .aside.nb{width:275px;gap:12px;padding:20px 13px;font-family:Montserrat,system-ui,sans-serif}
  .nb .promos{display:grid;gap:6px;padding:0 7px}
  .nb .b3d{position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);color:#fff;overflow:hidden;transition:transform .15s}
  .nb .b3d:hover{transform:translateY(-2px)}
  .nb .b3d .t{display:flex;flex-direction:column;line-height:1.15}
  .nb .b3d small{font-size:11px;opacity:.85}
  .nb .b3d b{font-size:14px;font-weight:700}
  .nb .b3d .slot{font-size:22px;width:24px;height:24px}
  .nb .b3d.gold{background:linear-gradient(0deg,rgb(212,175,55),rgb(176,141,87));text-shadow:1px 1px 1px rgba(160,120,50,.9);box-shadow:0 3px 0 rgb(148,111,53),0 3px 16px rgba(120,90,30,.8)}
  .nb .b3d.purple{background:linear-gradient(0deg,rgb(107,33,168),rgb(75,21,105));text-shadow:1px 1px 1px rgba(40,20,65,.8);box-shadow:0 3px 0 rgb(59,12,140),0 4px 16px rgba(40,20,65,.7)}
  .nb .b3d.orange{background:linear-gradient(to top,rgb(245,158,11),rgb(217,119,6));text-shadow:1px 1px 1px rgb(180,83,9);box-shadow:0 3px 0 rgb(146,64,14)}
  .nb .lst{border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);overflow:hidden}
  .nb .row{padding:12px;gap:12px;border-radius:16px;color:rgb(229,231,235);font-size:14px;font-weight:500;transition:all .3s}
  .nb .row:hover{background:rgba(255,255,255,.1);transform:scale(1.02) translateX(4px)}
  .nb .row .slot{font-size:20px;width:20px;height:20px;color:rgb(var(--p400))}
  .nb .row:hover .slot{color:rgb(var(--p300))}
  .nb .head{display:flex;align-items:center;gap:12px;padding:16px;font-size:14px;font-weight:600;color:rgb(229,231,235);transition:background .3s}
  .nb .head:hover{background:rgba(255,255,255,.1)}
  .nb .hbox{display:inline-flex;padding:8px;border-radius:8px;background:rgba(255,255,255,.1)}
  .nb .hbox .slot{font-size:20px;width:20px;height:20px}
  .nb .chev{opacity:1;color:rgb(156,163,175);font-size:16px}
  .nb .sub{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 24px;border-radius:12px;border-bottom:1px solid rgba(255,255,255,.05);color:rgb(209,213,219);font-size:14px;font-weight:500;transition:all .3s}
  .nb .sub:hover{background:rgba(255,255,255,.05);transform:translateX(4px)}
  .nb .sub .slot{font-size:20px;width:20px;height:20px;color:rgb(156,163,175)}
  .nb .sub:hover .slot{color:rgb(var(--p400))}
  .nb .lnk{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:rgb(229,231,235);font-size:14px;font-weight:500}
  .nb .lnk:hover{background:rgba(255,255,255,.05)}
  .nb .social{display:flex;justify-content:center;gap:16px;padding:8px 0}
  .nb .social .slot{width:30px;height:30px;border-radius:50%;background:rgb(var(--p100));color:rgb(31,41,55);font-size:18px;transition:background .2s}
  .nb .social .slot:hover{background:rgb(var(--p400))}

  /* ---------- T2 · menu (barra de 86px com ilustrações + painel 216px bg-muted-900; cores fixas no CSS do site) ---------- */
  .aside.t2{width:auto;flex-direction:row;align-items:flex-start;gap:0;font-family:"Bricolage Grotesque",system-ui,sans-serif}
  .t2 .rail{display:flex;flex-direction:column;gap:20px;padding:48px 0 16px}
  .t2 .ri{position:relative;width:86px;min-height:68px;padding:40px 8px 18px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;border-radius:12px;cursor:pointer;transition:transform .2s}
  .t2 .ri:not(.on):hover{transform:scale(1.1)}
  .t2 .ri .bgshape{position:absolute;inset:0;width:100%;height:100%}
  .t2 .ri .ico{position:absolute;z-index:1;top:-12px;left:50%;transform:translateX(-50%);display:flex;transition:all .2s}
  .t2 .ri .ico .slot{width:48px;height:48px;font-size:36px;color:#bed3d3}
  .t2 .ri:not(.on) .ico{opacity:.7}
  .t2 .ri .lbl{position:relative;z-index:1;width:100%;margin-top:auto;padding:0 4px;font-size:12px;font-weight:600;line-height:1.25;text-align:center;color:#bed3d3;transition:color .25s}
  .t2 .ri.on .lbl{color:#fff}
  .t2 .panel{width:216px;margin-top:28px;padding-bottom:24px;border-radius:12px;background:rgb(var(--m900));overflow:hidden}
  .t2 .tabs{display:flex;gap:8px;padding:12px;margin-bottom:4px}
  .t2 .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 4px;border-radius:8px;border:1px solid rgb(var(--m800));background:rgb(var(--m900));
           color:#bed3d3;font-size:14px;font-weight:500;transition:all .15s}
  .t2 .tab:hover{background:linear-gradient(rgb(24,26,39),rgb(24,47,64))}
  .t2 .tab .slot{width:32px;height:32px;font-size:26px}
  .t2 .row{justify-content:space-between;gap:8px;padding:8px 18px;border-radius:0;border-right:2px solid transparent;color:#bed3d3;font-size:14px;font-weight:500}
  .t2 .row:hover{background:linear-gradient(90deg,rgba(108,227,255,0) 0,rgba(5,116,141,.3) 100%)}
  .t2 .row .slot{width:14px;height:14px;font-size:14px;color:#bed3d3}

  /* ---------- B2 · menu (aside 257px bg-muted-900; cards primary-900; banners t4-banner-gradient; botões t4-button-gradient) ---------- */
  .aside.b2{width:257px;gap:4px;padding:0 0 16px;border-radius:8px;background:rgb(var(--m900));overflow:hidden;font-family:Outfit,system-ui,sans-serif}
  .b2 .cards, .b2 .lnks{display:flex;gap:4px}
  .b2 .card{flex:1;position:relative;height:59px;border-radius:8px;background:rgb(var(--p900));overflow:hidden}
  /* medido no site: bloco w-[45px] p-3 flex-col justify-center items-start; o texto (10px/12px 600) se ajusta à palavra mais longa */
  .b2 .card .t{position:relative;z-index:1;width:45px;height:100%;padding:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
  .b2 .card .t span{font-size:10px;font-weight:600;line-height:12px;color:rgb(var(--m200))}
  /* imagem: absolute -right-1, centralizada, h-[54px] w-auto (inteira, sem corte) */
  .b2 .card .slot{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:auto;height:54px;font-size:40px;color:rgb(var(--p200))}
  .b2 .card .slot img{width:auto;height:100%}
  .b2 .lnk{flex:1;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:4px;border:1px solid rgb(var(--p500));background:rgb(var(--p700));color:rgb(var(--p200));font-size:14px;font-weight:500;line-height:1.2;transition:filter .15s}
  .b2 .lnk:hover{filter:brightness(1.1)}
  .b2 .lnk .slot{width:22px;height:22px;font-size:20px}
  .b2 .banner{position:relative;display:flex;align-items:flex-start;height:75px;padding:16px 2px 0 16px;border-radius:8px 8px 0 0;overflow:hidden;
              background:linear-gradient(0deg,#0003 0 100%),linear-gradient(83deg,rgb(var(--m900)) 28.9%,rgb(var(--m400)) 96.78%)}
  .b2 .banner.short{height:66px}
  .b2 .bt{position:relative;z-index:1;flex:1;min-width:0;line-height:1.2}
  .b2 .bt p{margin:0;font-size:14px;font-weight:800;color:#fff;text-transform:uppercase}
  .b2 .bt div{max-width:140px;margin-top:2px;font-size:12px;line-height:14px;font-weight:500;color:rgb(var(--m100));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .b2 .banner.short .bt div{font-size:10px;line-height:12px}
  .b2 .bi{position:absolute;object-fit:contain;pointer-events:none}
  .b2 .bi.casino{right:4px;top:24px;height:90px}
  /* "chest" e não "box": .box é a classe genérica de bloco (fundo, borda e padding) */
  .b2 .bi.chest{right:4px;top:8px;height:79px}
  .b2 .bi.general{right:-20px;top:-28px;height:110px}
  .b2 .btns{display:flex;flex-direction:column;gap:4px;padding:4px 16px 8px}
  /* site: --t4-grad-dark muted-900 → --t4-grad-light muted-700, background-size 200% e desliza no hover (0.5s) */
  .b2 .btn{display:flex;align-items:center;gap:4px;width:225px;height:36px;padding:0 12px;border-radius:8px;
           background:linear-gradient(90deg,rgb(var(--m900)) 0%,rgb(var(--m900)) 50%,rgb(var(--m700)) 100%);background-size:200% 100%;background-position:0 0;transition:background-position .5s ease-in-out}
  .b2 .btn:hover{background-position:100% 0}
  .b2 .btn .slot{width:12px;height:12px;font-size:12px;color:rgb(var(--m300));transition:color .15s}
  .b2 .btn > span:not(.slot){font-size:14px;font-weight:800;line-height:1.2;white-space:nowrap;color:rgb(var(--m300));transition:color .15s}
  .b2 .btn:hover .slot, .b2 .btn:hover > span{color:#fff}
  .b2 .smalls{display:flex;flex-direction:column;gap:8px;padding:10px 16px 8px}
  .b2 .sm{display:flex;align-items:center;gap:4px;color:rgb(var(--m300));font-size:14px;font-weight:500;cursor:pointer}
  .b2 .sm .slot{width:11px;height:10px;font-size:11px}
  .b2 .sm:hover, .b2 .sm:hover .slot{color:#fff}
  .b2 .wheel{position:relative;display:flex;align-items:center;height:112px;margin:4px 8px 0;border-radius:16px;overflow:hidden;background:linear-gradient(to bottom,#c33d31,#b2824d);transition:filter .2s}
  .b2 .wheel:hover{filter:brightness(1.05)}
  .b2 .wheel p{position:relative;z-index:1;width:100px;margin:0;padding:20px;font-size:22px;font-weight:700;line-height:17px;color:#fff}
  .b2 .wheel img{position:absolute;right:0;top:0;width:109px;height:112px;object-fit:contain;filter:drop-shadow(-12px 11px 14px rgba(0,0,0,.21))}
</style>
</head>
<body>
<div class="top">
  <h1>Nacional · Troca de ícones</h1>
  <div class="field"><label for="theme">Tema</label><select id="theme"></select></div>
  <!-- Menu lateral oculto a pedido do Celio (14/09/2026): não vai ser usado por enquanto. Para voltar, tirar o "hidden". -->
  <div class="field" hidden><label>Área</label>
    <div class="tabs" role="tablist">
      <button role="tab" data-area="nav" aria-selected="true">Navbar</button>
      <button role="tab" data-area="menu" aria-selected="false">Menu lateral</button>
    </div>
  </div>
  <div class="field"><label for="lib">Biblioteca de ícones</label><select id="lib"></select></div>
  <div class="field"><label for="brand">Cores (Brand)</label><select id="brand"></select></div>
  <div class="field"><label for="langSel">Idioma</label><select id="langSel"></select></div>
  <button class="reset" id="reset">Restaurar padrão deste tema</button>
</div>

<div class="main">
  <div>
    <p class="hint">Arraste um ícone da biblioteca e solte sobre um item. O ponto amarelo marca os itens trocados. No nav, arraste o <b>nome</b> de um item e solte sobre outro para mudar a posição (Menu, Adicionar e Perfil ficam fixos). Tudo fica salvo neste navegador.</p>
    <div class="stage" id="stage"></div>
  </div>
  <aside class="palette">
    <h2 id="libTitle"></h2>
    <p class="src" id="libSrc"></p>
    <div class="grid" id="grid"></div>
  </aside>
</div>

function orderedNav(t) {
  const nav = THEMES[t].nav;
  const movable = nav.filter(i => !i.fixed);
  const saved = swaps[t]?.order;
  const valid = Array.isArray(saved) && saved.length === movable.length && movable.every(i => saved.includes(i.id));
  const seq = valid ? saved.map(id => movable.find(i => i.id === id)) : movable;
  let k = 0;
  return nav.map(i => i.fixed ? i : seq[k++]);
}
function moveNavItem(id, targetId) {
  const seq = orderedNav(state.theme).filter(i => !i.fixed).map(i => i.id);
  const from = seq.indexOf(id), to = seq.indexOf(targetId);
  if (from < 0 || to < 0 || from === to) return;
  seq.splice(from, 1); seq.splice(to, 0, id);
  (swaps[state.theme] ??= {}).order = seq;
  save(); renderStage();
}

    }
  }).join("");
  return `<div class="aside ${t.toLowerCase()}">${blocks}</div>`;
}
function renderStage() {
  const stage = document.getElementById("stage");
  for (const [k, v] of Object.entries(themeColors(state.theme))) stage.style.setProperty(`--${k}`, v);
  stage.innerHTML = state.area === "nav" ? renderNav(state.theme) : renderMenu(state.theme);
}
/* Biblioteca = ícones da biblioteca escolhida + ícones padrão do nav do tema (vindos do site).
   Ícone que está em uso no nav aparece como vaga vazia (não arrastável); ao ser trocado, volta a ficar disponível. (14/09/2026) */
const defaultLabel = ref => THEMES[state.theme].nav.find(i => i.icon === ref)?.label;
const iconsInUse = () => new Set(THEMES[state.theme].nav.map(i => swapOf(i)?.icon || i.icon));
function renderPalette() {
  const lib = LIBRARIES[state.lib];
  const defs = THEMES[state.theme].nav.map(i => i.icon).filter(n => !lib.icons.includes(n));
  const all = [...lib.icons, ...defs.filter((n, k) => defs.indexOf(n) === k)];
  const used = iconsInUse();
  const emUso = all.filter(n => used.has(n)).length;
  document.getElementById("libTitle").textContent = lib.name;
  document.getElementById("libSrc").textContent = `Lumos Design System Engine · 01 — Foundations · ${lib.icons.length} ícones + ${all.length - lib.icons.length} padrão do tema · ${emUso} em uso`;
  document.getElementById("grid").innerHTML = all.map(n => {
    const u = used.has(n);
    return `<div class="chip${u ? " used" : ""}" draggable="${u ? "false" : "true"}" data-icon="${n}" title="${u ? "em uso no nav · " : ""}${n}">${iconHTML(n) || "?"}<span>${tr(labelFor(state.lib, n) || defaultLabel(n)) || n /* sem anotação "Item:" → nome real do Figma (nome do componente) */}</span></div>`;
  }).join("");
}
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.area === state.area));
  document.getElementById("theme").value = state.theme;
  document.getElementById("lib").value = state.lib;
  document.getElementById("brand").value = swaps[state.theme]?.brand || "";
  renderStage(); renderPalette();
}

/* ---------- controles ---------- */
const themeSel = document.getElementById("theme");
themeSel.innerHTML = THEME_ORDER.filter(k => THEMES[k]).map(k => `<option value="${k}">${k}</option>`).join("");
const libSel = document.getElementById("lib");
/* Bibliotecas do menu lateral ocultas do seletor (14/09/2026), junto com a aba; continuam em LIBRARIES. */
libSel.innerHTML = Object.entries(LIBRARIES).filter(([k]) => !k.startsWith("menu-")).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
const useDefaultLib = () => { state.lib = THEMES[state.theme].libs[state.area]; };
themeSel.onchange = () => { state.theme = themeSel.value; useDefaultLib(); render(); };
libSel.onchange = () => { state.lib = libSel.value; renderPalette(); };
const brandSel = document.getElementById("brand");
brandSel.innerHTML = `<option value="">Cor do site (padrão do tema)</option>` + BRAND_MODES.map(m => `<option value="${m}">${m}</option>`).join("");
brandSel.onchange = () => {
  if (brandSel.value) (swaps[state.theme] ??= {}).brand = brandSel.value;
  else if (swaps[state.theme]) delete swaps[state.theme].brand;
  save(); renderStage();
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { state.area = b.dataset.area; useDefaultLib(); render(); });
/* idioma: troca todos os textos do nav, do menu e da biblioteca (salvo no navegador, separado das trocas de ícone) */
const langSel = document.getElementById("langSel");
langSel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
langSel.value = lang;
document.documentElement.lang = lang;
langSel.onchange = () => {
  lang = langSel.value;
  try { localStorage.setItem(LANG_KEY, lang); } catch {}
  document.documentElement.lang = lang;
  render();
};

/* confirmação no próprio botão: confirm() nativo é bloqueado em alguns navegadores embutidos e retorna false */
const resetBtn = document.getElementById("reset");
const RESET_LABEL = resetBtn.textContent;
let resetTimer = null;
const disarmReset = () => { clearTimeout(resetTimer); resetTimer = null; resetBtn.textContent = RESET_LABEL; resetBtn.classList.remove("armed"); };
resetBtn.onclick = () => {
  if (!resetTimer) {
    resetBtn.textContent = `Clique de novo para restaurar o ${state.theme}`;
    resetBtn.classList.add("armed");
    resetTimer = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  delete swaps[state.theme]; save(); render();
};

/* ---------- drag and drop ---------- */
const grid = document.getElementById("grid");
grid.addEventListener("dragstart", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  e.dataTransfer.setData("text/plain", chip.dataset.icon);
  e.dataTransfer.effectAllowed = "copy";
  document.body.classList.add("dragging");
});
const NAV_TYPE = "application/x-nav-item";
const clearReorder = () => document.querySelectorAll(".reorder-over").forEach(x => x.classList.remove("reorder-over"));
document.addEventListener("dragend", () => { document.body.classList.remove("dragging", "reordering"); clearReorder(); });
const stage = document.getElementById("stage");
stage.addEventListener("dragstart", e => {
  const h = e.target.closest?.("[data-move]"); if (!h) return;
  e.dataTransfer.setData(NAV_TYPE, h.dataset.move);
  e.dataTransfer.effectAllowed = "move";
  document.body.classList.add("reordering");
});
const reorderTarget = e => {
  const el = e.target.closest?.("[data-item]");
  return el && !el.dataset.fixed ? el : null;
};
stage.addEventListener("dragover", e => {
  if (e.dataTransfer.types.includes(NAV_TYPE)) {
    const el = reorderTarget(e); if (!el) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    stage.querySelectorAll(".reorder-over").forEach(x => x !== el && x.classList.remove("reorder-over"));
    el.classList.add("reorder-over");
    return;
  }
  const s = e.target.closest(".slot"); if (!s) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  stage.querySelectorAll(".slot.over").forEach(x => x !== s && x.classList.remove("over"));
  s.classList.add("over");
});
stage.addEventListener("dragleave", e => { const s = e.target.closest(".slot"); if (s && !s.contains(e.relatedTarget)) s.classList.remove("over"); });
stage.addEventListener("drop", e => {
  if (e.dataTransfer.types.includes(NAV_TYPE)) {
    const el = reorderTarget(e); if (!el) return;
    e.preventDefault();
    document.body.classList.remove("reordering"); clearReorder();
    moveNavItem(e.dataTransfer.getData(NAV_TYPE), el.dataset.item);
    return;
  }
  const s = e.target.closest(".slot"); if (!s) return;
  e.preventDefault();
  const icon = e.dataTransfer.getData("text/plain"); if (!icon) return;
  const label = labelFor(state.lib, icon) || defaultLabel(icon);
  const item = THEMES[state.theme].nav.find(i => i.id === s.dataset.id);
  const bag = ((swaps[state.theme] ??= {})[state.area] ??= {});
  if (item && item.icon === icon) delete bag[s.dataset.id]; /* ícone padrão de volta ao seu lugar = desfaz a troca */
  else bag[s.dataset.id] = label ? { icon, label } : { icon };
  save(); document.body.classList.remove("dragging"); renderStage(); renderPalette();
});

useDefaultLib(); render();
</script>
</body>
</html>
